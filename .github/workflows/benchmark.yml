name: Benchmark do modelo (muzi)

on:
  workflow_dispatch:
    inputs:
      model:
        description: "modelo HF a avaliar"
        default: "Qwen/Qwen2.5-0.5B-Instruct"

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      MODEL: ${{ github.event.inputs.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar deps
        run: pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu && pip install --quiet transformers accelerate
      - name: Rodar benchmark
        working-directory: training
        run: python -u benchmark.py
      - name: Upload relatorio
        uses: actions/upload-artifact@v4
        with:
          name: muzi-benchmark
          path: training/out/benchmark.txt
          if-no-files-found: error
