name: Build APK (Muzi Mini)

on:
  workflow_dispatch:      # botao "Run workflow" na aba Actions
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decodificar keystore (secret)
        run: echo "${{ secrets.MUZI_KEYSTORE_B64 }}" | base64 -d > android/app/muzi.keystore

      - name: Build debug APK
        working-directory: android
        env:
          MUZI_STORE_PASS: ${{ secrets.MUZI_STORE_PASS }}
          MUZI_KEY_PASS: ${{ secrets.MUZI_KEY_PASS }}
          MUZI_KEY_ALIAS: ${{ secrets.MUZI_KEY_ALIAS }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: muzi-mini-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
